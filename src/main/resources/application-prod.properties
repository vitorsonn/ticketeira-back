# Production Configuration Profile

# Database - Usually provided by the hosting service (Render, Railway, etc.)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Stripe - Use Live Key in Production
stripe.api.key=${STRIPE_API_KEY}

# JWT - Must be a strong random string in Production
api.security.token.secret=${JWT_SECRET}

# JPA / Hibernate - Security & Stability for Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway - Ensure migrations run on startup
spring.flyway.enabled=true
